{{- $ns       := include "langfuse.namespace" . }}
{{- $pgPass    := .Values.postgres.password   | default "langfuse" }}
{{- $chPass    := .Values.clickhouse.password | default "langfuse" }}
{{- $minioUser := .Values.minio.rootUser      | default "langfuse" }}
{{- $minioPwd  := .Values.minio.rootPassword  | default "langfuse123" }}
{{- $redisPass := .Values.redis.password      | default "langfuse" }}

# --- PostgreSQL (Langfuse metadata) ---
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-postgres
  namespace: {{ $ns | quote }}
  labels:
    app: langfuse-postgres
    component: langfuse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langfuse-postgres
  template:
    metadata:
      labels:
        app: langfuse-postgres
        component: langfuse
    spec:
      containers:
        - name: postgres
          image: {{ .Values.images.postgres }}
          env:
            - name: POSTGRES_USER
              value: langfuse
            - name: POSTGRES_PASSWORD
              value: {{ $pgPass | quote }}
            - name: POSTGRES_DB
              value: langfuse
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "langfuse", "-d", "langfuse"]
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: langfuse-postgres-pvc

# --- ClickHouse (trace/observation store) ---
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-clickhouse
  namespace: {{ $ns | quote }}
  labels:
    app: langfuse-clickhouse
    component: langfuse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langfuse-clickhouse
  template:
    metadata:
      labels:
        app: langfuse-clickhouse
        component: langfuse
    spec:
      containers:
        - name: clickhouse
          image: {{ .Values.images.clickhouse }}
          env:
            - name: CLICKHOUSE_DB
              value: langfuse
            - name: CLICKHOUSE_USER
              value: default
            - name: CLICKHOUSE_PASSWORD
              value: {{ $chPass | quote }}
          ports:
            - name: http
              containerPort: 8123
            - name: native
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /ping
              port: 8123
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
            - name: config
              mountPath: /etc/clickhouse-server/config.d/langfuse.xml
              subPath: langfuse.xml
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: langfuse-clickhouse-pvc
        - name: config
          configMap:
            name: langfuse-clickhouse-config

# --- Redis (task queue) ---
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-redis
  namespace: {{ $ns | quote }}
  labels:
    app: langfuse-redis
    component: langfuse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langfuse-redis
  template:
    metadata:
      labels:
        app: langfuse-redis
        component: langfuse
    spec:
      containers:
        - name: redis
          image: {{ .Values.images.redis }}
          # Require a password so Langfuse's REDIS_AUTH matches — without it the
          # web/worker log "ERR AUTH … called without any password configured".
          command: ["redis-server", "--requirepass", "$(REDIS_PASSWORD)"]
          env:
            - name: REDIS_PASSWORD
              value: {{ $redisPass | quote }}
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli --no-auth-warning -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: langfuse-redis-pvc

# --- MinIO (S3-compatible blob store) ---
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-minio
  namespace: {{ $ns | quote }}
  labels:
    app: langfuse-minio
    component: langfuse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langfuse-minio
  template:
    metadata:
      labels:
        app: langfuse-minio
        component: langfuse
    spec:
      containers:
        - name: minio
          image: {{ .Values.images.minio }}
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              value: {{ $minioUser | quote }}
            - name: MINIO_ROOT_PASSWORD
              value: {{ $minioPwd | quote }}
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          readinessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: langfuse-minio-pvc

# --- Langfuse Web (UI + API) ---
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-web
  namespace: {{ $ns | quote }}
  labels:
    app: langfuse-web
    component: langfuse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langfuse-web
  template:
    metadata:
      labels:
        app: langfuse-web
        component: langfuse
    spec:
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.images.wait }}
          command: ["sh", "-c", "until nc -z langfuse-postgres 5432; do echo waiting for postgres; sleep 2; done"]
        # `nc -z` proves only that the socket is open. ClickHouse binds 8123 well before its query
        # engine can serve, so a port-only wait lets Langfuse start its ClickHouse migration against
        # a half-ready server. Observed 2026-08-23: the migration failed mid-way and left
        # `Dirty database version 39`, after which langfuse-web CrashLoopBackOff'd forever — a state
        # no restart clears, because the dirty marker survives in ClickHouse itself.
        # Asking for an actual query result is what distinguishes "listening" from "serving".
        - name: wait-for-clickhouse
          image: {{ .Values.images.wait }}
          # Credentials are required: an unauthenticated query answers 403, which would make this
          # loop wait forever on a perfectly healthy server. Passed as headers rather than as
          # `?password=` query parameters so the password never enters a URL, a process list or a
          # ClickHouse query log.
          envFrom:
            - secretRef:
                name: langfuse-secret
          command:
            - sh
            - -c
            - |
              until wget -q -O- \
                    --header="X-ClickHouse-User: $CLICKHOUSE_USER" \
                    --header="X-ClickHouse-Key: $CLICKHOUSE_PASSWORD" \
                    'http://langfuse-clickhouse:8123/?query=SELECT%201' 2>/dev/null | grep -q '^1$'; do
                echo 'waiting for clickhouse to SERVE, not just listen'
                sleep 3
              done
        - name: wait-for-redis
          image: {{ .Values.images.wait }}
          command: ["sh", "-c", "until nc -z langfuse-redis 6379; do echo waiting for redis; sleep 2; done"]
        - name: wait-for-minio
          image: {{ .Values.images.wait }}
          command: ["sh", "-c", "until nc -z langfuse-minio 9000; do echo waiting for minio; sleep 2; done"]
      containers:
        - name: langfuse-web
          image: {{ .Values.images.langfuse }}
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: langfuse-secret
          env:
            - name: CLICKHOUSE_URL
              value: "http://langfuse-clickhouse:8123"
            - name: CLICKHOUSE_MIGRATION_URL
              value: "clickhouse://langfuse-clickhouse:9000"
            - name: TELEMETRY_ENABLED
              value: "false"
            - name: LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES
              value: "false"
            - name: LANGFUSE_RETENTION_DAYS
              value: "365"
          readinessProbe:
            httpGet:
              path: /api/public/health
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /api/public/health
              port: 3000
            initialDelaySeconds: 90
            periodSeconds: 20
            failureThreshold: 3

# --- Langfuse Worker (background jobs) ---
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-worker
  namespace: {{ $ns | quote }}
  labels:
    app: langfuse-worker
    component: langfuse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langfuse-worker
  template:
    metadata:
      labels:
        app: langfuse-worker
        component: langfuse
    spec:
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.images.wait }}
          command: ["sh", "-c", "until nc -z langfuse-postgres 5432; do echo waiting for postgres; sleep 2; done"]
        # `nc -z` proves only that the socket is open. ClickHouse binds 8123 well before its query
        # engine can serve, so a port-only wait lets Langfuse start its ClickHouse migration against
        # a half-ready server. Observed 2026-08-23: the migration failed mid-way and left
        # `Dirty database version 39`, after which langfuse-web CrashLoopBackOff'd forever — a state
        # no restart clears, because the dirty marker survives in ClickHouse itself.
        # Asking for an actual query result is what distinguishes "listening" from "serving".
        - name: wait-for-clickhouse
          image: {{ .Values.images.wait }}
          # Credentials are required: an unauthenticated query answers 403, which would make this
          # loop wait forever on a perfectly healthy server. Passed as headers rather than as
          # `?password=` query parameters so the password never enters a URL, a process list or a
          # ClickHouse query log.
          envFrom:
            - secretRef:
                name: langfuse-secret
          command:
            - sh
            - -c
            - |
              until wget -q -O- \
                    --header="X-ClickHouse-User: $CLICKHOUSE_USER" \
                    --header="X-ClickHouse-Key: $CLICKHOUSE_PASSWORD" \
                    'http://langfuse-clickhouse:8123/?query=SELECT%201' 2>/dev/null | grep -q '^1$'; do
                echo 'waiting for clickhouse to SERVE, not just listen'
                sleep 3
              done
        - name: wait-for-redis
          image: {{ .Values.images.wait }}
          command: ["sh", "-c", "until nc -z langfuse-redis 6379; do echo waiting for redis; sleep 2; done"]
        - name: wait-for-minio
          image: {{ .Values.images.wait }}
          command: ["sh", "-c", "until nc -z langfuse-minio 9000; do echo waiting for minio; sleep 2; done"]
      containers:
        - name: langfuse-worker
          image: {{ .Values.images.langfuseWorker }}
          envFrom:
            - secretRef:
                name: langfuse-secret
          env:
            - name: CLICKHOUSE_URL
              value: "http://langfuse-clickhouse:8123"
            - name: CLICKHOUSE_MIGRATION_URL
              value: "clickhouse://langfuse-clickhouse:9000"
            - name: LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES
              value: "false"
            - name: LANGFUSE_RETENTION_DAYS
              value: "365"
