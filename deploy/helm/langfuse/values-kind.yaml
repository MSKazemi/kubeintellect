# Kind (local dev) overrides — smaller PVCs, seeded credentials for zero-config startup
# UI: http://langfuse.local  (~2 min to become healthy after deploy)
# Login: admin@kubeintellect.local / langfuse-admin

postgres:
  storage: "5Gi"
  password: "langfuse"

clickhouse:
  storage: "10Gi"
  password: "langfuse"

redis:
  storage: "1Gi"
  password: "langfuse"

minio:
  storage: "20Gi"
  rootUser: "langfuse"
  rootPassword: "langfuse123"

nextauthUrl: "http://langfuse.local"
nextauthSecret: "changeme-nextauth-secret-min-32-chars-long"
salt: "changeme-salt-value"
encryptionKey: "36653cf14b2bc0d0158f283af1e50c5401321ddb9850fcd7be7a3417ad950a4f"

# publicKey / secretKey are injected at install time by `make langfuse-install`, which
# --sets them (and the matching kubeintellect secret) from .env after `make langfuse-provision`.
# Left blank here on purpose — a stale placeholder default would break trace/cost capture.
initUser:
  email: "admin@kubeintellect.local"
  name: "Admin"
  password: "langfuse-admin"
initOrg:
  id: "kubeintellect-org"
  name: "KubeIntellect"
initProject:
  id: "kubeintellect-project"
  name: "KubeIntellect"
  publicKey: ""
  secretKey: ""

ingress:
  enabled: true
  host: "langfuse.local"
