# DEMO 1 — a crash-loop with the cause in the container's own logs.
# payments-api exits 1 on boot because DATABASE_URL is unset. The manifest looks fine; only the
# log says why. This is the case where `kubectl get pods` shows the symptom and nothing else.
apiVersion: apps/v1
kind: Deployment
metadata: {name: payments-api, namespace: shop}
spec:
  replicas: 2
  selector: {matchLabels: {app: payments-api}}
  template:
    metadata: {labels: {app: payments-api}}
    spec:
      containers:
        - name: api
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              echo "payments-api starting (build 4.2.1)"
              if [ -z "$DATABASE_URL" ]; then
                echo "FATAL: DATABASE_URL is not set; refusing to start" >&2
                echo "hint: the value is provisioned by the 'payments-db' Secret" >&2
                exit 1
              fi
              exec sleep 3600
          env:
            - {name: SERVICE_NAME, value: payments-api}
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
