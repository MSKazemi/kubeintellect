# DEMO 5 — Pending forever: a memory request no node can satisfy.
# The event is on the POD, not the Deployment, and the Deployment reports
# `Available=False` with no reason a `get deploy` would show.
apiVersion: apps/v1
kind: Deployment
metadata: {name: ml-scorer, namespace: shop}
spec:
  replicas: 1
  selector: {matchLabels: {app: ml-scorer}}
  template:
    metadata: {labels: {app: ml-scorer}}
    spec:
      containers:
        - name: scorer
          image: busybox:1.37
          command: [sh, -c, "sleep 3600"]
          resources: {requests: {memory: 512Gi, cpu: 64}}
