apiVersion: v1
kind: Namespace
metadata:
  name: scenario-test
  labels:
    managed-by: kubeintellect-scenarios
---
# FAULT: liveness probe checks /health but app only serves /healthz (→ 404)
# Low failureThreshold means kubelet kills the container after 2 failures (~10s)
# The app itself is healthy — this is a probe misconfiguration, not an app crash
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-server
  namespace: scenario-test
  labels:
    scenario: "17-liveness-loop"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-server
  template:
    metadata:
      labels:
        app: app-server
        scenario: "17-liveness-loop"
    spec:
      containers:
        - name: app
          image: nginx:1.25
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              # Intentional fault: nginx has no /health route → returns 404
              # The correct path for this app would be /healthz
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
