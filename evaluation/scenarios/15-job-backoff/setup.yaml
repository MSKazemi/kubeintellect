apiVersion: v1
kind: Namespace
metadata:
  name: scenario-test
  labels:
    managed-by: kubeintellect-scenarios
---
apiVersion: batch/v1
kind: Job
metadata:
  name: data-migration
  namespace: scenario-test
  labels:
    scenario: "15-job-backoff"
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: data-migration
        scenario: "15-job-backoff"
    spec:
      restartPolicy: Never
      containers:
        - name: migrator
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Starting data migration..."
              echo "ERROR: Cannot connect to database at postgres.internal:5432"
              echo "Migration failed: connection refused"
              exit 1
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
