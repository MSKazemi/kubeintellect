apiVersion: v1
kind: Namespace
metadata:
  name: scenario-test
  labels:
    managed-by: kubeintellect-scenarios
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: broken-claim
  namespace: scenario-test
  labels:
    scenario: "05-pvc-unbound"
spec:
  # Intentional fault: this storage class does not exist
  storageClassName: fake-storage-class
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pvc-app
  namespace: scenario-test
  labels:
    scenario: "05-pvc-unbound"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pvc-app
  template:
    metadata:
      labels:
        app: pvc-app
        scenario: "05-pvc-unbound"
    spec:
      containers:
        - name: app
          image: nginx:1.25
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: broken-claim
