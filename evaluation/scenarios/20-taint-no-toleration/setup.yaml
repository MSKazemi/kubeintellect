apiVersion: v1
kind: Namespace
metadata:
  name: scenario-test
  labels:
    managed-by: kubeintellect-scenarios
---
# NOTE: Before applying this scenario, taint the worker node:
#   kubectl taint nodes testbed-v2-worker dedicated=gpu:NoSchedule
# Cleanup: kubectl taint nodes testbed-v2-worker dedicated=gpu:NoSchedule-
#
# FAULT: pod has no toleration for the taint — scheduler rejects all nodes
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-workload
  namespace: scenario-test
  labels:
    scenario: "20-taint-no-toleration"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gpu-workload
  template:
    metadata:
      labels:
        app: gpu-workload
        scenario: "20-taint-no-toleration"
    spec:
      containers:
        - name: app
          image: nginx:1.25
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      # Intentional fault: no tolerations block — pod cannot be scheduled
      # on any node that carries the dedicated=gpu:NoSchedule taint
