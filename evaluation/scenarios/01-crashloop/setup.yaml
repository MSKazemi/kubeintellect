apiVersion: v1
kind: Namespace
metadata:
  name: scenario-test
  labels:
    managed-by: kubeintellect-scenarios
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: faulty-app
  namespace: scenario-test
  labels:
    scenario: "01-crashloop"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: faulty-app
  template:
    metadata:
      labels:
        app: faulty-app
        scenario: "01-crashloop"
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              if [ -z "$REQUIRED_ENV" ]; then
                echo "FATAL: REQUIRED_ENV is not set. Cannot start."
                exit 1
              fi
              echo "App started successfully"
              sleep 3600
          env:
            - name: REQUIRED_ENV
              value: ""
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
