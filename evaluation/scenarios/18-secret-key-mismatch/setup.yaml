apiVersion: v1
kind: Namespace
metadata:
  name: scenario-test
  labels:
    managed-by: kubeintellect-scenarios
---
# Secret exists and is correctly formed — the fault is in how the pod references it
# Key in Secret: DATABASE_URL
# Key referenced by pod: DB_URL  (wrong — causes CreateContainerConfigError)
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: scenario-test
  labels:
    scenario: "18-secret-key-mismatch"
type: Opaque
stringData:
  DATABASE_URL: "postgres://user:pass@db.internal:5432/appdb"
  LOG_LEVEL: "info"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-app
  namespace: scenario-test
  labels:
    scenario: "18-secret-key-mismatch"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-app
  template:
    metadata:
      labels:
        app: api-app
        scenario: "18-secret-key-mismatch"
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "echo starting; sleep 3600"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  # Intentional fault: Secret has key DATABASE_URL, not DB_URL
                  key: DB_URL
            - name: LOG_LEVEL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: LOG_LEVEL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
