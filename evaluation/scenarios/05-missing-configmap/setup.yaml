apiVersion: v1
kind: Namespace
metadata:
  name: scenario-test
  labels:
    managed-by: kubeintellect-scenarios
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-app
  namespace: scenario-test
  labels:
    scenario: "05-missing-configmap"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-app
  template:
    metadata:
      labels:
        app: config-app
        scenario: "05-missing-configmap"
    spec:
      containers:
        - name: app
          image: nginx:1.25
          envFrom:
            - configMapRef:
                name: nonexistent-config   # this ConfigMap does not exist
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
