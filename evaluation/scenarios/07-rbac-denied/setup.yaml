apiVersion: v1
kind: Namespace
metadata:
  name: scenario-test
  labels:
    managed-by: kubeintellect-scenarios
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: limited-sa
  namespace: scenario-test
  labels:
    scenario: "07-rbac-denied"
---
# Intentional fault: Role exists but no RoleBinding links it to limited-sa
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: scenario-test
  labels:
    scenario: "07-rbac-denied"
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
# NOTE: No RoleBinding created — the SA has no permissions
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rbac-app
  namespace: scenario-test
  labels:
    scenario: "07-rbac-denied"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rbac-app
  template:
    metadata:
      labels:
        app: rbac-app
        scenario: "07-rbac-denied"
    spec:
      serviceAccountName: limited-sa
      containers:
        - name: app
          image: bitnami/kubectl:latest
          command:
            - sh
            - -c
            - |
              echo "Attempting to list pods..."
              kubectl get pods -n scenario-test
              echo "Exit code: $?"
              sleep 3600
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
