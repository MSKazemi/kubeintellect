apiVersion: v1
kind: Namespace
metadata:
  name: scenario-test
  labels:
    managed-by: kubeintellect-scenarios
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe-app
  namespace: scenario-test
  labels:
    scenario: "08-probe-fail"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: probe-app
  template:
    metadata:
      labels:
        app: probe-app
        scenario: "08-probe-fail"
    spec:
      containers:
        - name: app
          image: nginx:1.25
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              # Intentional fault: nginx listens on 80, probe checks 9999
              port: 9999
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: probe-service
  namespace: scenario-test
  labels:
    scenario: "08-probe-fail"
spec:
  selector:
    app: probe-app
  ports:
    - port: 80
      targetPort: 80
