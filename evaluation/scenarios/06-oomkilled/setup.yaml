apiVersion: v1
kind: Namespace
metadata:
  name: scenario-test
  labels:
    managed-by: kubeintellect-scenarios
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-hog
  namespace: scenario-test
  labels:
    scenario: "06-oomkilled"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: memory-hog
  template:
    metadata:
      labels:
        app: memory-hog
        scenario: "06-oomkilled"
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Allocating memory..."
              # Allocate ~100MB via dd — will exceed 64Mi limit and get OOMKilled
              dd if=/dev/zero of=/tmp/blob bs=1M count=100
              echo "Done"
              sleep 3600
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi    # container will exceed this → OOMKilled (exit 137)
