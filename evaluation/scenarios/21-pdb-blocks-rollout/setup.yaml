apiVersion: v1
kind: Namespace
metadata:
  name: scenario-test
  labels:
    managed-by: kubeintellect-scenarios
---
# Step 1: deploy with a good image and 1 replica
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-service
  namespace: scenario-test
  labels:
    scenario: "21-pdb-blocks-rollout"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # never take the running pod down before a new one is ready
      maxSurge: 1
  template:
    metadata:
      labels:
        app: web-service
        scenario: "21-pdb-blocks-rollout"
    spec:
      containers:
        - name: app
          image: nginx:1.25
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
---
# FAULT: PDB requires at least 1 pod always available.
# With only 1 replica and maxUnavailable=0, the rollout controller cannot
# evict the old pod to make room — rollout stalls indefinitely.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web-service-pdb
  namespace: scenario-test
  labels:
    scenario: "21-pdb-blocks-rollout"
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: web-service
