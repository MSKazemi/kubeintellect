apiVersion: v1
kind: Namespace
metadata:
  name: scenario-test
  labels:
    managed-by: kubeintellect-scenarios
---
# FAULT: pod spec references serviceAccountName: metrics-reader, but that
# ServiceAccount was never created in the namespace.
# Result: CreateContainerConfigError — pod never starts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-app
  namespace: scenario-test
  labels:
    scenario: "24-missing-serviceaccount"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metrics-app
  template:
    metadata:
      labels:
        app: metrics-app
        scenario: "24-missing-serviceaccount"
    spec:
      serviceAccountName: metrics-reader   # intentional fault: does not exist
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
