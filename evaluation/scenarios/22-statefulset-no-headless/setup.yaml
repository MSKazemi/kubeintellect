apiVersion: v1
kind: Namespace
metadata:
  name: scenario-test
  labels:
    managed-by: kubeintellect-scenarios
---
# FAULT: StatefulSet references serviceName: "db-headless" but that Service
# does not exist. StatefulSet pods stay Pending because the governing service
# is required before pods can be created.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db-cluster
  namespace: scenario-test
  labels:
    scenario: "22-statefulset-no-headless"
spec:
  serviceName: "db-headless"   # intentional fault: this service is never created
  replicas: 1
  selector:
    matchLabels:
      app: db-cluster
  template:
    metadata:
      labels:
        app: db-cluster
        scenario: "22-statefulset-no-headless"
    spec:
      containers:
        - name: db
          image: nginx:1.25
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
