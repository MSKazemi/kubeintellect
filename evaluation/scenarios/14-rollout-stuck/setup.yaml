apiVersion: v1
kind: Namespace
metadata:
  name: scenario-test
  labels:
    managed-by: kubeintellect-scenarios
---
# Step 1: Deploy a healthy version first
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-api
  namespace: scenario-test
  labels:
    scenario: "14-rollout-stuck"
  annotations:
    # Bad image update — rolling update will be stuck
    deployment.kubernetes.io/revision: "2"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: web-api
        scenario: "14-rollout-stuck"
    spec:
      containers:
        - name: app
          # Intentional fault: bad image tag introduced by a rollout
          image: nginx:99.99-bad-rollout
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
