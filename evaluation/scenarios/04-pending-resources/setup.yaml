apiVersion: v1
kind: Namespace
metadata:
  name: scenario-test
  labels:
    managed-by: kubeintellect-scenarios
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hungry-app
  namespace: scenario-test
  labels:
    scenario: "04-pending-resources"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hungry-app
  template:
    metadata:
      labels:
        app: hungry-app
        scenario: "04-pending-resources"
    spec:
      containers:
        - name: app
          image: nginx:1.25
          resources:
            requests:
              # Intentional fault: 50Gi memory will never be schedulable on any standard node
              cpu: 100m
              memory: 50Gi
            limits:
              cpu: 200m
              memory: 50Gi
