site_name: KubeIntellect v3
site_description: >-
  AI-powered Kubernetes management. Diagnose CrashLoopBackOff, pending pods,
  and RBAC issues in plain English — with human-approval gates before any
  write operation runs.
site_url: https://mskazemi.github.io/kubeintellect/
site_author: Mohsen Seyedkazemi Ardebili
repo_url: https://github.com/MSKazemi/kubeintellect
repo_name: MSKazemi/kubeintellect
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2024–2025 Mohsen Seyedkazemi Ardebili

theme:
  name: material
  custom_dir: overrides
  logo: assets/brand/ki-c-indigo.svg
  favicon: assets/brand/ki-c-indigo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.breadcrumbs
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
    - toc.follow

extra_css:
  - stylesheets/extra.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/MSKazemi/kubeintellect
      name: KubeIntellect on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/kubeintellect/
      name: kubeintellect on PyPI
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/kube-q/
      name: kube-q CLI on PyPI

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: On this page
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search:
      lang: en
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)'

nav:
  - Home: index.md
  - Quickstart: quickstart.md

  - Use:
    - What you can ask: capabilities.md
    - CLI Reference: cli-reference.md
    - Troubleshooting: troubleshooting.md

  - Install:
    - No cluster (quick try): install/no-cluster.md
    - Existing cluster: install/existing-cluster.md
    - Local Kind cluster: install/kind.md

  - Deploy:
    - Container Image: deploy/image.md
    - Docker Compose: deploy/docker-compose.md
    - Kind (dev env): deploy/kind.md
    - Cloud / VM (Helm): deploy/cloud.md

  - Reference:
    - Architecture: architecture.md
    - Configuration: configuration.md
    - Agent Behaviors: agent-behaviors.md
    - Memory: memory.md
    - Security: security.md
    - API Reference: api-reference.md
    - Glossary: glossary.md

  - Operations:
    - Operations Guide: operations.md
