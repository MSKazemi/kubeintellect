# A workload that gradually fills memory toward its limit so predictive detection
# (ADR-010) can project an OOM crossing BEFORE the kill, then actually OOMKills so
# the reactive detector fires too — letting f1_lead_time.py measure the lead time.
#
#   kubectl create namespace predictive-test
#   kubectl apply -f oom_leak.yaml
#   uv run python scripts/validate/f1_lead_time.py
#   kubectl delete namespace predictive-test    # cleanup
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mem-leak
  namespace: predictive-test
  labels: { app: mem-leak }
spec:
  replicas: 1
  selector: { matchLabels: { app: mem-leak } }
  template:
    metadata: { labels: { app: mem-leak } }
    spec:
      containers:
        - name: leak
          image: python:3.13-alpine
          # ~6Mi of ANONYMOUS memory every 20s. 128Mi limit → crosses in ~6 min, then OOMKills.
          #
          # This used to write into /dev/shm, and in that form it could not OOMKill anything —
          # which matters here more than anywhere, because f1_lead_time.py measures the lead
          # time between the predicted crossing and the kill, and there was never a kill.
          # A container's /dev/shm defaults to 64Mi (half this limit), so `dd` hit ENOSPC at
          # 64Mi and the pod sat healthy forever; the error was sent to /dev/null. Mounting a
          # bigger memory-backed emptyDir does not fix it either — the kubelet clamps such a
          # volume to the pod's memory limit, so the tmpfs fills exactly when the cgroup would
          # and ENOSPC still wins. Anonymous pages are the only thing that can drive the cgroup
          # OOM, and they are also what "RSS climbs toward the limit" actually describes.
          command: ["python", "-u", "-c"]
          args:
            - |
              import time
              held = []
              step = 6 * 1024 * 1024
              while True:
                  held.append(bytearray(step))   # zero-filled, therefore resident
                  print(f"held {len(held) * step // (1024 * 1024)}MiB", flush=True)
                  time.sleep(20)
          resources:
            limits: { memory: "128Mi" }
            requests: { memory: "32Mi" }
