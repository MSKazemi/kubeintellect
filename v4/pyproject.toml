# Virtual workspace root (ADR-004) — the publishable projects live in packages/:
#   packages/kubeintellect-server  -> the `kubeintellect` distribution (server, module name `app`)
#   packages/kube-q                -> the `kq` CLI client
#   packages/ki-protocol           -> shared SSE wire protocol
# Integration tests stay in ./tests (they also exercise the local evaluation/ harness).

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    # Pulls every workspace member (editable) into the dev environment.
    "kubeintellect[tracing,metrics]",
    "pytest>=8",
    "pytest-asyncio>=1.0",
    "pytest-mock>=3.14",
    "respx>=0.22",
    # Pinned below 0.16 deliberately: 0.16 enables new default rules that report
    # 438 findings across app/ (mostly EXE002 + import style). Adopting them is a
    # standalone cleanup, not something to fold into a security bump — ruff has no
    # advisory against it. Raise this bound once that cleanup lands.
    "ruff>=0.15,<0.16",
    "mypy>=1.19",
    "types-PyYAML",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=1.0.6",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "numpy>=2.0",
]

[tool.uv.sources]
kubeintellect = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"


[tool.mypy]
python_version = "3.12"

[[tool.mypy.overrides]]
# asyncpg ships no py.typed marker, so there are no stubs that could ever be
# "installed" for it — this silences the resulting [import-untyped] noise
# without masking real type errors elsewhere.
module = ["asyncpg.*"]
ignore_missing_imports = true
