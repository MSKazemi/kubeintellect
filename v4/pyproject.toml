# Virtual workspace root (ADR-004) — the publishable projects live in packages/:
#   packages/kubeintellect-server  -> the `kubeintellect` distribution (server, module name `app`)
#   packages/kube-q                -> the `kq` CLI client
#   packages/ki-protocol           -> shared SSE wire protocol
# Integration tests stay in ./tests (they also exercise the local evaluation/ harness).

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    # Pulls every workspace member (editable) into the dev environment.
    "kubeintellect[tracing,metrics]",
    "pytest>=8",
    "pytest-asyncio>=1.0",
    "pytest-mock>=3.14",
    "pytest-timeout>=2.4",
    "respx>=0.22",
    # Pinned below 0.16 deliberately: 0.16 enables new default rules that reported
    # 438 findings across app/, now 342 after #70 cleared the EXE002 family.
    # Adopting the rest is a standalone cleanup, not something to fold into a
    # security bump — ruff has no advisory against it. Raise this bound once that
    # cleanup lands, one rule family per PR, and read the UP045 warning in
    # AGENTS.md first: autofixing that family silently disables RBAC and the HITL
    # gate.
    "ruff>=0.15,<0.16",
    "mypy>=2.3.1",
    "types-PyYAML>=6.0.12",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=1.0.6",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "numpy>=2.5.2",
]

[tool.uv.sources]
kubeintellect = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# A suite with no timeout cannot fail on a hang — it just stops, and in CI it burns until the
# six-hour job ceiling with no failure message to read. This happened for real: one test drove
# the sensorium's `_watch_loop` and depended on the HOST not having kubectl installed. Where
# kubectl exists the loop retries with backoff forever, so the test did not fail, it wedged.
#
# 120s is ~85x the slowest legitimate test in this suite (the whole suite runs in ~85s), so it
# can only ever fire on a genuine hang, never on a slow-but-working test on a loaded CI runner.
timeout = 120
timeout_method = "thread"

[tool.mypy]
python_version = "3.12"

[[tool.mypy.overrides]]
# asyncpg ships no py.typed marker, so there are no stubs that could ever be
# "installed" for it — this silences the resulting [import-untyped] noise
# without masking real type errors elsewhere.
module = ["asyncpg.*"]
ignore_missing_imports = true
