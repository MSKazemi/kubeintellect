[project]
name = "ki-protocol"
version = "1.1.3"
description = "KubeIntellect wire protocol — single source of truth for the typed SSE event format shared by server and clients."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Mohsen Seyedkazemi Ardebili", email = "mohsen.seyedkazemi@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "pydantic>=2.13.5",
]

[project.urls]
Homepage = "https://kubeintellect.com"
Documentation = "https://kubeintellect.com/docs"
Repository = "https://github.com/MSKazemi/kubeintellect"
Changelog = "https://github.com/MSKazemi/kubeintellect/blob/main/CHANGELOG.md"
Issues = "https://github.com/MSKazemi/kubeintellect/issues"
Paper = "https://doi.org/10.1007/s10723-026-09837-6"

[tool.hatch.build.targets.wheel]
packages = ["ki_protocol"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
