name: TerminatingStuck
detect:
  # A pod is "stuck" only if it stays Terminating well past any reasonable grace
  # period AND is never actually removed. The engine arms on the Terminating
  # status and fires only after debounce_seconds of the condition *persisting*;
  # a DELETED watch event (normal termination completing) disarms the key, so
  # ordinary churn (jobs, rollouts, drains) no longer produces false firings.
  # debounce_seconds is the grace-overrun proxy — 600s is far beyond the default
  # 30s grace and typical graceful-shutdown windows, so only genuinely stuck
  # pods survive it.
  watch_predicates:
    - kind: Pod
      status_regex: "^Terminating$"
  debounce_seconds: 600
triggers:
  - pod_status_regex: "Terminating"
investigation_steps:
  - "kubectl get pod <pod> -n <ns> -o yaml — read metadata.finalizers and deletionTimestamp."
  - "kubectl describe pod <pod> -n <ns> — check for graceful-shutdown hooks blocking termination."
  - "kubectl get events -n <ns> --sort-by=.lastTimestamp — look for finalizer/controller errors."
expected_evidence:
  - "deletionTimestamp set but pod still Terminating"
  - "Non-empty metadata.finalizers list"
  - "Controller failing to remove a finalizer"
recommended_fix_template: |
  The pod is stuck in Terminating. Suggested fix: <ACTION> (resolve the blocking
  finalizer, kill the lingering process via kubectl exec, or as a last resort use
  `kubectl delete pod <pod> --grace-period=0 --force`).
