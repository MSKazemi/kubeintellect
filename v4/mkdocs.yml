site_name: KubeIntellect v4
site_description: >-
  AI-powered Kubernetes management. Diagnose CrashLoopBackOff, pending pods,
  and RBAC issues in plain English — with human-approval gates before any
  write operation runs.
site_url: https://mskazemi.github.io/kubeintellect/
site_author: Mohsen Seyedkazemi Ardebili
repo_url: https://github.com/MSKazemi/kubeintellect
repo_name: MSKazemi/kubeintellect
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2024–2025 Mohsen Seyedkazemi Ardebili

theme:
  name: material
  custom_dir: overrides
  logo: assets/brand/ki-c-indigo.svg
  favicon: assets/brand/ki-c-indigo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.breadcrumbs
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
    - toc.follow

extra_css:
  - stylesheets/extra.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/MSKazemi/kubeintellect
      name: KubeIntellect on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/kubeintellect/
      name: kubeintellect on PyPI
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/kube-q/
      name: kube-q CLI on PyPI

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: On this page
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search:
      lang: en
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)'

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Research: research.md

  - Use:
    - What you can ask: capabilities.md
    - Examples & cookbook: examples.md
    - Autonomous operations: autonomy.md
    - CLI Reference: cli-reference.md
    - How it compares (vs k8sgpt / HolmesGPT): comparison.md
    - FAQ: faq.md
    - Troubleshooting: troubleshooting.md

  # Install = get the software running quickly (pip / CLI paths).
  - Install:
    - No cluster (quick try): install/no-cluster.md
    - Existing cluster: install/existing-cluster.md
    - Kind via pip (simple local K8s): install/kind.md

  # Deploy = run it properly on real infrastructure (containers / cloud / Helm).
  - Deploy:
    - Container Image: deploy/image.md
    - Docker Compose: deploy/docker-compose.md
    - Kind dev env (repo, full stack): deploy/kind.md
    - Cloud / VM (Helm): deploy/cloud.md
    - AWS EKS: deploy/aws.md
    - Google Cloud GKE: deploy/gcp.md
    - Alibaba Cloud: deploy/alibaba.md

  - Reference:
    - Architecture: architecture.md
    - V2 vs V4 (models): v2-vs-v4-models.md
    - Configuration: configuration.md
    - V5 experimental flags: v5-experimental-flags.md
    - Agent Behaviors: agent-behaviors.md
    - Memory Hierarchy: memory.md
    - Flight Recorder: flight-recorder.md
    - Reflexion Subsystem: reflexion.md
    - Security: security.md
    - API Reference: api-reference.md
    - Glossary: glossary.md
    - Changelog: changelog.md

  - Operations:
    - Operations Guide: operations.md
    - Upgrade & feature flags: upgrade.md
