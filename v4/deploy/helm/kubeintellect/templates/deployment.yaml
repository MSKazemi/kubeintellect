{{- /*
  The shutdown budget has to hold for values the user supplies, not only for the values files
  this chart ships. `tests/test_chart_shutdown_contract.py` asserts grace - drain >= 15 across
  every `values*.yaml` in git — but a `--set drainSeconds=60` or a private `-f my-values.yaml`
  is not in git, and until 2026-08-24 `helm install` rendered it happily: a 60s preStop sleep
  inside a 45s grace period, SIGKILLed 15s before the drain ends, silently reintroducing the
  dropped requests the hook exists to prevent. The symptom is a few lost requests per rolling
  update with no error anywhere, which is not a thing anyone traces back to a values file.

  Failing here is the same mechanism `configmap.yaml` uses for the safety brakes. The 15s floor
  is the repository's existing rule, not a new one — in-flight requests and the Postgres pool
  shutdown are spent in what is left after the sleep.
*/ -}}
{{- $drain := int (.Values.drainSeconds | default 0) }}
{{- $grace := int (.Values.terminationGracePeriodSeconds | default 45) }}
{{- if and (gt $drain 0) (lt (sub $grace $drain) 15) }}
{{-   fail (printf "terminationGracePeriodSeconds (%d) leaves only %ds after the %ds preStop drain. The sleep is spent inside the grace budget, so Kubernetes SIGKILLs the pod mid-drain and the in-flight requests the hook exists to protect are dropped anyway. Set terminationGracePeriodSeconds to at least %d, or lower drainSeconds. Chart defaults: drainSeconds=5, terminationGracePeriodSeconds=45." $grace (sub $grace $drain) $drain (add $drain 15)) }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubeintellect.fullname" . }}
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "kubeintellect.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "kubeintellect.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kubeintellect.selectorLabels" . | nindent 8 }}
      annotations:
        # Without this a ConfigMap-only `helm upgrade` rewrites the map and leaves the old pod
        # running with the OLD env: settings are read once at startup. Flipping an experiment
        # flag would then report success while changing nothing.
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      # Must stay above drainSeconds: the preStop sleep is spent inside this budget, and a
      # SIGKILL at the deadline lands mid-drain. The Kubernetes default of 30s is not enough
      # once the sleep and in-flight requests both have to fit.
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds | default 45 }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      containers:
        - name: kubeintellect
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.hotReload.enabled }}
          command:
            - /app/.venv/bin/python
            - -m
            - uvicorn
            - app.main:app
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --reload
            - --reload-dir
            - /app/app
          env:
            - name: WATCHFILES_FORCE_POLLING
              value: "true"
          {{- end }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "kubeintellect.fullname" . }}-config
            - secretRef:
                name: {{ include "kubeintellect.fullname" . }}-secrets
          {{- if or .Values.hotReload.enabled .Values.containerSecurityContext.readOnlyRootFilesystem }}
          volumeMounts:
          {{- end }}
          {{- if .Values.hotReload.enabled }}
            - name: hot-code
              mountPath: /app/app
          {{- end }}
          {{- if .Values.containerSecurityContext.readOnlyRootFilesystem }}
            # With a read-only root, every path the process writes must be an explicit mount.
            # HOME is /home/app in the image (Dockerfile: useradd app, HOME=/home/app) -- kubectl
            # writes its discovery and HTTP cache there, and Python writes temp files. Without
            # these the container starts cleanly and then fails on the first kubectl call, which
            # reads as an RBAC problem rather than a filesystem one.
            - name: tmp
              mountPath: /tmp
            - name: kube-cache
              mountPath: /home/app/.kube/cache
          {{- end }}
          # THE drain mechanism. Kubernetes runs preStop *before* SIGTERM, and only this
          # sleep keeps the listening socket open while the Endpoints removal propagates
          # through every kube-proxy. Do not replace it with a readiness flip: uvicorn
          # closes its socket the instant SIGTERM lands and runs the app's shutdown hook
          # only afterwards, so a probe during drain observes ECONNREFUSED, never a 503 —
          # a request on a stale route is dropped rather than served. Measured, not assumed.
          {{- if gt (int .Values.drainSeconds) 0 }}
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sleep", "{{ .Values.drainSeconds }}"]
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          # Readiness is a DIFFERENT question from liveness: "route to me right now?".
          # /readyz reports local state only. It governs a RUNNING pod — a terminating one is
          # dropped from EndpointSlices by deletion itself, whatever the probe says, which is
          # why the preStop sleep above is what drains a rolling update and this is not.
          # It deliberately does not probe Postgres: a dependency-checking readiness probe
          # takes every replica out of the Service at once when the shared DB blips, turning
          # degradation into an outage.
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 1
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # CONTAINER-level hardening. The pod-level securityContext above only sets the UID; it
          # says nothing about privilege escalation, kernel capabilities, or the syscall filter,
          # and those are what turn a code-execution bug in a dependency into node compromise.
          # This container needs no capabilities at all: it makes outbound HTTP calls and execs
          # kubectl. Dropping ALL is not a guess — it is the actual requirement.
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
      {{- if or .Values.hotReload.enabled .Values.containerSecurityContext.readOnlyRootFilesystem }}
      volumes:
      {{- end }}
      {{- if .Values.containerSecurityContext.readOnlyRootFilesystem }}
        - name: tmp
          emptyDir: {}
        - name: kube-cache
          emptyDir: {}
      {{- end }}
      {{- if .Values.hotReload.enabled }}
        - name: hot-code
          hostPath:
            path: {{ .Values.hotReload.hostPath }}
            type: Directory
      {{- end }}
