apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubeintellect.fullname" . }}
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "kubeintellect.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "kubeintellect.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kubeintellect.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      # Give the drain window somewhere to happen: SIGTERM flips /readyz to 503, and the pod
      # needs to outlive the seconds it takes kube-proxy to observe the Endpoints removal.
      # Without this the default 30s applies and the process may exit while routes are stale.
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds | default 45 }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      containers:
        - name: kubeintellect
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.hotReload.enabled }}
          command:
            - /app/.venv/bin/python
            - -m
            - uvicorn
            - app.main:app
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --reload
            - --reload-dir
            - /app/app
          env:
            - name: WATCHFILES_FORCE_POLLING
              value: "true"
          {{- end }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "kubeintellect.fullname" . }}-config
            - secretRef:
                name: {{ include "kubeintellect.fullname" . }}-secrets
          {{- if .Values.hotReload.enabled }}
          volumeMounts:
            - name: hot-code
              mountPath: /app/app
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          # Readiness is a DIFFERENT question from liveness: "route to me right now?".
          # /readyz reports local state only — 200 while serving, 503 once draining — so a
          # rolling update stops receiving traffic before it closes its pools. It deliberately
          # does not probe Postgres: a dependency-checking readiness probe takes every replica
          # out of the Service at once when the shared DB blips, turning degradation into an
          # outage. failureThreshold is 1 because draining should take effect immediately.
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 1
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.hotReload.enabled }}
      volumes:
        - name: hot-code
          hostPath:
            path: {{ .Values.hotReload.hostPath }}
            type: Directory
      {{- end }}
