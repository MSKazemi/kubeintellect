apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kubeintellect.fullname" . }}-config
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "kubeintellect.labels" . | nindent 4 }}
data:
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  LLM_PROVIDER: {{ .Values.config.llmProvider | quote }}
  AZURE_OPENAI_API_VERSION: {{ .Values.config.azureApiVersion | quote }}
  {{- if not .Values.postgres.external.enabled }}
  # PostgreSQL — in-cluster StatefulSet connection
  POSTGRES_HOST: {{ printf "%s-postgres" (include "kubeintellect.fullname" .) | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  {{- end }}
  # Observability — URLs of Prometheus and Loki in the target cluster (empty = not configured).
  PROMETHEUS_URL: {{ .Values.config.prometheusUrl | default "" | quote }}
  LOKI_URL: {{ .Values.config.lokiUrl | default "" | quote }}
  # Langfuse — KubeIntellect's internal LLM tracing.
  # Install charts/langfuse/ separately and set config.langfuseHost to its service URL.
  LANGFUSE_ENABLED: {{ .Values.config.langfuseEnabled | default false | toString | quote }}
  LANGFUSE_HOST: {{ .Values.config.langfuseHost | default "" | quote }}
  # V4 platform flags — toggles the tiered Cortex graph (operator mode) vs the lean
  # V2 coordinator from the SAME image. Set config.cortexV4Enabled=true for the V4 arm.
  CORTEX_V4_ENABLED: {{ .Values.config.cortexV4Enabled | default false | toString | quote }}
  WATCHTOWER_ENABLED: {{ .Values.config.watchtowerEnabled | default true | toString | quote }}
  AUTONOMY_LEVEL: {{ .Values.config.autonomyLevel | default "A1" | quote }}
  # V4 showcase layers (all opt-in, fail-open). Enable for the full MemoryAgent demo.
  PREDICTIVE_DETECTION_ENABLED: {{ .Values.config.predictiveDetectionEnabled | default false | toString | quote }}
  NL_DETECTOR_AUTHORING_ENABLED: {{ .Values.config.nlDetectorAuthoringEnabled | default false | toString | quote }}
  POSTMORTEM_LLM_NARRATIVE: {{ .Values.config.postmortemLlmNarrative | default false | toString | quote }}
  # Cluster identity for memory / findings / learned patterns. An in-cluster pod has no
  # kubeconfig context to derive a name from, so without this the id falls back to the
  # "unknown" sentinel — harmless for one cluster, but two clusters sharing a database would
  # then share one memory scope. Set config.clusterId whenever that is possible.
  CLUSTER_ID: {{ .Values.config.clusterId | default "" | quote }}
  # In-cluster auth — empty KUBECONFIG_PATH makes kubectl use the pod's ServiceAccount token.
  # kubectl_tool.py sets KUBECONFIG env var from this value; an empty path causes kubectl
  # to skip kubeconfig file loading and fall back to in-cluster auth automatically.
  KUBECONFIG_PATH: ""
  # Agent kubectl guardrails — namespaces and resource types the agent cannot touch.
  # Edit config.blockedNamespaces / config.blockedResources in values.yaml to adjust.
  KUBECTL_BLOCKED_NAMESPACES: {{ .Values.config.blockedNamespaces | join "," | quote }}
  KUBECTL_BLOCKED_RESOURCES: {{ .Values.config.blockedResources | join "," | quote }}
  {{- /* Escape hatch for flags with no dedicated value (see values.yaml config.extraEnv).
         Rendered last so an explicit override wins on duplicate keys in the emitted map.

         The two SAFETY BRAKES are refused here, by name. They are deliberately not settable
         through Helm values: docs/autonomy.md tells an operator, on the page they read during an
         incident, exactly how the brakes are engaged, and a second undocumented path that only
         works through a values file is the kind of thing nobody finds at 3am. This escape hatch
         exists to carry additive, default-off EXPERIMENT flags, which is a different job from
         operating a brake. Failing loudly beats silently accepting a key that an operator would
         then believe had stopped the agent. */}}
  {{- range $key, $value := .Values.config.extraEnv }}
  {{- if has $key (list "KI_V5_KILL_SWITCH" "KI_V5_CHANGE_FREEZE") }}
  {{- fail (printf "config.extraEnv must not set %s. The safety brakes are not a Helm value; see docs/autonomy.md for how to engage them." $key) }}
  {{- end }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
