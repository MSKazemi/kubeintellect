name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (build only, do not upload)"
        type: boolean
        default: false

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for trusted publishing (OIDC)

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      # All three workspace packages publish together: the kubeintellect dist
      # depends on kube-q and ki-protocol, so they must exist on PyPI too (ADR-004).
      - name: Build sdists and wheels for all workspace packages
        run: |
          python -m build --outdir dist packages/ki-protocol
          python -m build --outdir dist packages/kube-q
          python -m build --outdir dist packages/kubeintellect-server

      - name: Upload to PyPI
        if: ${{ !inputs.dry_run }}
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # v1.14.0
        with:
          skip-existing: true   # re-running on an already-published version is a no-op, not a failure
