name: OSSF Scorecard

# Runs the OpenSSF Scorecard checks (branch protection, pinned dependencies,
# dangerous workflow patterns, code review coverage, etc.) and publishes the
# result to the public Scorecard API so it shows up as a badge and on
# securityscorecards.dev — a standard, third-party-verifiable signal for
# anyone evaluating whether to depend on this project.
#
# `publish_results: true` requires the workflow to run from the default
# branch or a scheduled/dispatch trigger, never from a fork's pull_request —
# hence no `pull_request` trigger here.

on:
  branch_protection_rule:
  schedule:
    - cron: "23 4 * * 2" # weekly, Tuesday — branch-protection settings and
      # pinned-action drift move slowly; this is not a per-PR gate.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    if: github.repository == 'MSKazemi/kubeintellect'
    permissions:
      security-events: write # to upload SARIF to code scanning
      id-token: write # to publish results to the public Scorecard API
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: results.sarif
