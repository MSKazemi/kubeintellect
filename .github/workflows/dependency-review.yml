name: Dependency review

# Blocks a PR that introduces a dependency with a known vulnerability or an
# incompatible license BEFORE merge — the gap this closes: Dependabot alerts
# fire AFTER a bad dependency is already on main. This looks at the diff of
# manifests/lockfiles a PR actually changes.
#
# Read-only: it only comments on the PR and fails its own check. It cannot
# modify anything, so it needs no write permissions.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write # to post the summary comment on the PR

concurrency:
  group: dependency-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
