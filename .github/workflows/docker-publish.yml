name: Publish container image

# Publishes the KubeIntellect server image to GHCR and Docker Hub.
#
# The build context is v4/ and the Dockerfile copies only the three workspace
# package source trees — never the repository root. Combined with the fact that
# CI checks out the PUBLIC repository, private material (design/, papers/,
# priv/, evaluation/, v5/, ...) cannot reach the image.
#
# Trigger: push a v* tag, or run manually from Actions -> Publish container
# image. Manual runs support a dry run that builds and authenticates to both
# registries without pushing — use it to verify credentials before a release.
#
# Both registries are required: a missing Docker Hub secret fails the run rather
# than silently publishing to GHCR alone.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (build only, do not push)"
        type: boolean
        default: false

env:
  GHCR_IMAGE: ghcr.io/mskazemi/kubeintellect
  DOCKERHUB_IMAGE: docker.io/kazemi/kubeintellect

# Publishing runs ONLY from the canonical public repo. The private superset tracks this
# same .github/ tree and is pushed to MSKazemi/kubeintellect-private,
# kubeintellect/kubeintellect-private and GitLab — so without the per-job repository
# guard below, a tag push there would publish a SECOND, divergent set of artifacts.
# Today only the Actions billing failure prevents that, which is luck, not design.
jobs:
  publish:
    if: github.repository == 'MSKazemi/kubeintellect'
    name: Build and publish image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write      # keyless sigstore signing via GitHub OIDC
      attestations: write  # write the build-provenance and SBOM attestations

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git describe needs tags for the VERSION build arg

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Both registries are REQUIRED. A missing credential used to emit a
      # ::warning:: and publish to GHCR only — which still reported success, so
      # a release could silently reach one registry and nobody would notice.
      # Fail loudly instead.
      - name: Verify Docker Hub credentials are present
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          missing=""
          [ -z "$DOCKERHUB_USERNAME" ] && missing="DOCKERHUB_USERNAME"
          [ -z "$DOCKERHUB_TOKEN" ] && missing="${missing:+$missing }DOCKERHUB_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s): ${missing}. Refusing to publish to GHCR only — set them under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "Docker Hub credentials present."

      # Both logins run even on a dry run: logging in pushes nothing, and it is
      # the only way a dry run can actually prove the credentials work. A dry
      # run that skips auth cannot tell you your token is valid.

      # GHCR needs no manually-managed secret — GITHUB_TOKEN plus the
      # packages:write permission above is enough.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive image names
        id: images
        run: |
          {
            echo "list<<EOF"
            echo "${GHCR_IMAGE}"
            echo "${DOCKERHUB_IMAGE}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.images.outputs.list }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,format=long
          labels: |
            org.opencontainers.image.source=https://github.com/MSKazemi/kubeintellect
            org.opencontainers.image.url=https://kubeintellect.com
            org.opencontainers.image.documentation=https://mskazemi.github.io/kubeintellect/
            org.opencontainers.image.licenses=AGPL-3.0-only

      - name: Resolve version metadata
        id: version
        run: |
          echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # linux/amd64 only for now. arm64 needs QEMU emulation here because the
      # builder compiles native Python wheels, which pushes build time past
      # 20 minutes — add setup-qemu-action and platforms: linux/amd64,linux/arm64
      # if arm64 images are wanted.
      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: v4
          file: v4/Dockerfile
          platforms: linux/amd64
          push: ${{ !inputs.dry_run }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_SHA=${{ steps.version.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Supply chain (A13) ────────────────────────────────────────────────
      # Everything below signs the DIGEST, not a tag: a tag is a mutable pointer, so an
      # attestation bound to one would say nothing about what a `:latest` pull returns
      # tomorrow. The same digest is pushed to both registries, so one attestation covers
      # the Docker Hub copy too.
      #
      # Skipped on a dry run for a substantive reason, not for speed: nothing was pushed,
      # so there is no published digest for anyone to verify, and signing an unpublished
      # one would put an entry in a public transparency log for an artifact that does not
      # exist.
      - name: Attest build provenance
        if: ${{ !inputs.dry_run }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # Generated FROM the built image, not from the lockfile: an SBOM derived from the
      # manifest describes what was meant to be installed, and the CVE that matters is
      # usually in the base-image package that no manifest mentions.
      - name: Generate SBOM from the built image
        if: ${{ !inputs.dry_run }}
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Attest the SBOM
        if: ${{ !inputs.dry_run }}
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Summary
        run: |
          {
            echo "### Published image"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo
              echo "_Dry run — nothing was pushed, but both registry logins were exercised, so the credentials above are proven valid._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
