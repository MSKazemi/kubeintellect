name: Publish container image

# Publishes the KubeIntellect server image to GHCR and Docker Hub.
#
# The build context is v4/ and the Dockerfile copies only the three workspace
# package source trees — never the repository root. Combined with the fact that
# CI checks out the PUBLIC repository, private material (design/, papers/,
# priv/, evaluation/, v5/, ...) cannot reach the image.
#
# Trigger: push a v* tag, or run manually from Actions -> Publish container
# image. Manual runs support a dry run that builds without pushing.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (build only, do not push)"
        type: boolean
        default: false

env:
  GHCR_IMAGE: ghcr.io/mskazemi/kubeintellect
  DOCKERHUB_IMAGE: docker.io/kazemi/kubeintellect

jobs:
  publish:
    name: Build and publish image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git describe needs tags for the VERSION build arg

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # GHCR needs no manually-managed secret — GITHUB_TOKEN plus the
      # packages:write permission above is enough.
      - name: Log in to GitHub Container Registry
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub is optional so the workflow still succeeds before the secrets
      # are added.
      - name: Check for Docker Hub credentials
        id: dockerhub
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -n "$DOCKERHUB_TOKEN" ] && [ -n "$DOCKERHUB_USERNAME" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Docker Hub credentials present — will publish there too."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DOCKERHUB_USERNAME/DOCKERHUB_TOKEN not set — publishing to GHCR only."
          fi

      - name: Log in to Docker Hub
        if: ${{ steps.dockerhub.outputs.enabled == 'true' && !inputs.dry_run }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive image names
        id: images
        run: |
          IMAGES="${GHCR_IMAGE}"
          if [ "${{ steps.dockerhub.outputs.enabled }}" = "true" ]; then
            IMAGES="${IMAGES}"$'\n'"${DOCKERHUB_IMAGE}"
          fi
          {
            echo "list<<EOF"
            echo "$IMAGES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.images.outputs.list }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,format=long
          labels: |
            org.opencontainers.image.source=https://github.com/MSKazemi/kubeintellect
            org.opencontainers.image.url=https://kubeintellect.com
            org.opencontainers.image.documentation=https://mskazemi.github.io/kubeintellect/
            org.opencontainers.image.licenses=AGPL-3.0-only

      - name: Resolve version metadata
        id: version
        run: |
          echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # linux/amd64 only for now. arm64 needs QEMU emulation here because the
      # builder compiles native Python wheels, which pushes build time past
      # 20 minutes — add setup-qemu-action and platforms: linux/amd64,linux/arm64
      # if arm64 images are wanted.
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: v4
          file: v4/Dockerfile
          platforms: linux/amd64
          push: ${{ !inputs.dry_run }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_SHA=${{ steps.version.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Published image"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo
              echo "_Dry run — nothing was pushed._"
            fi
            if [ "${{ steps.dockerhub.outputs.enabled }}" != "true" ]; then
              echo
              echo "> Docker Hub was skipped: DOCKERHUB_USERNAME/DOCKERHUB_TOKEN are not set."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
