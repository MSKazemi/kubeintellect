name: Label PRs

# Applies the same `area/*` taxonomy to PRs that TRIAGE.md applies to issues, so a
# contributor never has to know the repo's internal structure to get routed correctly.
#
# Uses `pull_request_target` so it also works on PRs from forks (the default token on a
# fork's `pull_request` event is read-only). This workflow runs against the BASE repo's
# config and checks out no PR code, so it does not execute anything from the fork.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13  # v7.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          # Never remove a label a human deliberately added during triage.
          sync-labels: false
