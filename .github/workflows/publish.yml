name: Publish to PyPI

# Root copy of v4/.github/workflows/publish.yml. Workflows only execute when they
# live in the repository ROOT .github/workflows/ — the per-version file under v4/
# is packaged with that directory and is never run by GitHub.
#
# Fires on a `v*` tag, alongside docker-publish.yml, helm-publish.yml and
# release-binaries.yml. Before this trigger existed the PyPI job was
# workflow_dispatch-only, so tagging a release shipped the image, the chart and the
# binaries but silently left PyPI on the previous version — a partial release that
# reported green. Also runnable by hand: Actions -> Publish to PyPI -> Run workflow.
#
# Requires a `pypi` environment with PyPI trusted publishing (OIDC) configured
# for all three distributions.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (build only, do not upload)"
        type: boolean
        default: false

permissions:
  contents: read

# Publishing runs ONLY from the canonical public repo. The private superset tracks this
# same .github/ tree and is pushed to MSKazemi/kubeintellect-private,
# kubeintellect/kubeintellect-private and GitLab — so without the per-job repository
# guard below, a tag push there would publish a SECOND, divergent set of artifacts.
# Today only the Actions billing failure prevents that, which is luck, not design.
jobs:
  publish:
    if: github.repository == 'MSKazemi/kubeintellect'
    name: Build and publish
    runs-on: ubuntu-latest
    environment: pypi
    defaults:
      run:
        working-directory: v4
    permissions:
      id-token: write   # required for trusted publishing (OIDC)

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      # All three workspace packages publish together: the kubeintellect dist
      # depends on kube-q and ki-protocol, so they must exist on PyPI too (ADR-004).
      - name: Build sdists and wheels for all workspace packages
        run: |
          python -m build --outdir dist packages/ki-protocol
          python -m build --outdir dist packages/kube-q
          python -m build --outdir dist packages/kubeintellect-server
          ls -l dist

      - name: Upload to PyPI
        # On a tag push `inputs.dry_run` is null, so this is true and the upload runs.
        if: ${{ !inputs.dry_run }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          # The workflow runs from v4/, but the action resolves paths from the
          # workspace root.
          packages-dir: v4/dist
          skip-existing: true   # re-running an already-published version is a no-op
          # PEP 740 attestations (A13). Stated explicitly rather than left to the action's
          # default: this is the only evidence a PyPI user has that the wheel they installed
          # was built by this workflow from this repo, and a default that silently flips off
          # would remove it without changing a line here. Requires trusted publishing, which
          # the `pypi` environment above already provides.
          attestations: true
