name: Snap

# Builds the `kubeintellect` snap (the `kq` CLI, strict confinement) from
# snap/snapcraft.yaml, and publishes it to the Snap Store on demand.
#
# Note for contributors: workflows only run when they live in the repository
# ROOT .github/workflows/. The per-version files under v1/…/v4/.github/ are
# packaged with those directories and are never executed by GitHub.
#
# Publishing requires a `SNAPCRAFT_STORE_CREDENTIALS` repository secret:
#   snapcraft export-login --snaps kubeintellect \
#       --acls package_access,package_push,package_update,package_release -
# Until that secret exists the publish job is skipped, and the build job still
# runs as a normal PR gate.

on:
  push:
    branches: [main]
    paths:
      - "snap/**"
      - "v4/packages/kube-q/**"
      - "v4/packages/ki-protocol/**"
      - ".github/workflows/snap.yml"
  pull_request:
    paths:
      - "snap/**"
      - "v4/packages/kube-q/**"
      - "v4/packages/ki-protocol/**"
      - ".github/workflows/snap.yml"
  workflow_dispatch:
    inputs:
      channel:
        description: "Store channel to release to (empty = build only)"
        type: choice
        default: ""
        options: ["", "edge", "beta", "candidate", "stable"]

permissions:
  contents: read

concurrency:
  group: snap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Publishing runs ONLY from the canonical public repo. The private superset tracks this
# same .github/ tree and is pushed to MSKazemi/kubeintellect-private,
# kubeintellect/kubeintellect-private and GitLab — so without the per-job repository
# guard below, a tag push there would publish a SECOND, divergent set of artifacts.
# Today only the Actions billing failure prevents that, which is luck, not design.
jobs:
  build:
    if: github.repository == 'MSKazemi/kubeintellect'
    name: Build snap (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-latest
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build
        id: build
        uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79  # v1.3.0

      # Smoke test: install the snap we just built and confirm the CLI starts.
      # `--dangerous` is required because a locally built snap is unsigned.
      # Only meaningful on the native runner architecture.
      - name: Install and smoke test
        run: |
          sudo snap install --dangerous "${{ steps.build.outputs.snap }}"
          sudo snap connect kubeintellect:dot-kube
          sudo snap connect kubeintellect:dot-kube-q
          kubeintellect --version
          kubeintellect --help
          kubeintellect.kq completion bash | head -5
          snap connections kubeintellect

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: snap-${{ matrix.arch }}
          path: ${{ steps.build.outputs.snap }}
          if-no-files-found: error

  # One publish job PER ARCH, fed from the artifacts `build` already produced.
  #
  # Two things this deliberately does NOT do:
  #   1. It does not rebuild. The old version ran its own `action-build` on a
  #      single ubuntu-latest runner, so the binary that reached the store was
  #      NOT the one the smoke test above had just validated.
  #   2. It does not run once. `ubuntu-latest` is amd64, so a single job could
  #      only ever publish amd64 — arm64 was built, smoke-tested, uploaded as an
  #      artifact and then silently discarded. The store would have shown an
  #      amd64-only snap while this file looked like it handled both.
  #
  # The runner architecture is irrelevant here: publishing is an upload, so both
  # arches publish from ubuntu-latest. `fail-fast: false` because a half-published
  # pair is recoverable by re-running, whereas cancelling a sibling mid-upload is
  # not obviously so.
  publish:
    name: Publish to the Snap Store (${{ matrix.arch }})
    needs: build
    if: >-
      github.repository == 'MSKazemi/kubeintellect' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.channel != '' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: snapstore
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: snap-${{ matrix.arch }}

      # action-publish takes a single path, and the artifact contains exactly one
      # .snap. Fail loudly rather than publishing a guess if that stops being true.
      - name: Resolve the snap file
        id: snap
        run: |
          shopt -s nullglob
          snaps=(*.snap)
          if [ ${#snaps[@]} -ne 1 ]; then
            echo "::error::expected exactly 1 .snap in artifact snap-${{ matrix.arch }}, found ${#snaps[@]}"
            exit 1
          fi
          echo "path=${snaps[0]}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${snaps[0]} to '${{ inputs.channel }}'"

      - name: Publish
        uses: snapcore/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40  # v1.2.0
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.snap.outputs.path }}
          release: ${{ inputs.channel }}
