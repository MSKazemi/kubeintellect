name: Dependabot auto-merge

# Enables GitHub's native auto-merge on a Dependabot PR for patch and minor
# bumps only — the merge itself still waits for every required status check
# to go green, exactly as it would for a human-authored PR. A major bump
# (an eslint 9->10 kind of change) is left alone for a human to look at,
# because "minor/patch is safe to wave through" stops being true right at
# a major version boundary — see the `Web (lint + build)` job in ci.yml for
# a real example of a major bump that broke the build while every other
# check stayed green.
#
# This does not bypass branch protection: `gh pr merge --auto` only ARMS
# auto-merge, which GitHub itself refuses to complete until the PR meets
# every required check and review the repository settings demand.

on:
  pull_request_target:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Enable auto-merge for patch/minor Dependabot PRs
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for patch/minor updates
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
