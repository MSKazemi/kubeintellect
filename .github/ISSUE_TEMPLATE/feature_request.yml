name: ✨ Feature request
description: Suggest a new capability or improvement.
title: "feat: <short summary>"
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea? We'd love to hear it. For **big / architectural** changes, please use the
        **RFC** template instead so we can discuss the design first.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the pain point or use case. What are you trying to do that's hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like KubeIntellect to do? A CLI example / query is great.
      placeholder: 'e.g. `kq -q "..."` should ...'
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why this one is better.
  - type: dropdown
    id: component
    attributes:
      label: Which area?
      options:
        - kube-q (CLI)
        - kubeintellect-server
        - Agents / orchestration
        - Detectors / sensorium
        - Memory subsystem
        - New integration (observability backend / LLM provider)
        - Docs / examples
        - Other
    validations:
      required: true
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'd be willing to help implement this.
