version: 2

# Scope: the v4 platform (current) plus the root CI workflows. v1–v3 are frozen
# legacy generations and are deliberately not tracked — dependency PRs against
# them would be noise no one intends to merge.
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels: [dependencies, github_actions]
    open-pull-requests-limit: 5

  - package-ecosystem: uv
    directory: "/v4"
    schedule:
      interval: weekly
    labels: [dependencies]
    open-pull-requests-limit: 5
    ignore:
      # ruff is pinned <0.16 on purpose — 0.16 enables new default rules that
      # reported 438 findings across app/, now 342 after #70 cleared EXE002.
      # Adopting the rest is a standalone cleanup, not a dependency bump, and
      # there is no advisory forcing it. Without this, dependabot reopens the
      # same failing PR every release (see #60). Remove once that cleanup lands.
      - dependency-name: ruff
        versions: [">=0.16"]
    groups:
      # One PR per week for routine patch/minor bumps keeps review cost low;
      # majors still arrive as individual PRs so they get read properly.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: "/v4"
    schedule:
      interval: weekly
    labels: [dependencies]
    open-pull-requests-limit: 3

  # The browser demo front-end. Not shipped in any wheel, but it is a public
  # surface (kubeintellect.com/demo) and it carried the only critical advisory
  # in the repo, so it needs tracking like everything else.
  - package-ecosystem: npm
    directory: "/v4/packages/kube-q/web"
    schedule:
      interval: weekly
    labels: [dependencies]
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
