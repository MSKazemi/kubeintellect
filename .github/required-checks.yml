# Which CI checks `main` actually requires — and why each one it does not require is not
# required. This file is a RECORD, not a control: GitHub branch protection lives in the
# repository settings and only an admin can change it. What this file buys is that the two
# cannot drift apart quietly.
#
# The gap it exists to close: `ci.yml` produces 15 named checks, branch protection requires 9,
# and nothing anywhere connected the two lists. A job could be added, renamed, or quietly left
# out of the required set and every PR would keep merging green — which is exactly what a
# required-check list is supposed to prevent.
#
# Verify this record against the live setting:  make check-required
# (needs an authenticated `gh` with repo scope; the check is not part of CI, which has no
# token for it.)

# ── Required. A PR cannot merge while one of these is red. ────────────────────────────────
required:
  - Lint (ruff)                     # also carries the doc-claims step (2026-08-28)
  - Types (mypy)
  - File modes
  - Syntax warnings                 # also carries the encoding and roster steps
  - Tests (server)
  - Tests (kube-q CLI)
  - Tests (server · py3.13)
  - Tests (kube-q CLI · py3.13)
  - Install smoke test
  # 2026-09-13: closes the two open questions below. Both were re-verified green on main
  # before being promoted — see the CI-hardening PR that made this change for the exact run.
  - Web (lint + build)
  - Container image (build + serve)

# ── Required, but NOT produced by ci.yml, so deliberately outside the `required`/
# `not_required` partition above — v4/tests/test_the_gates_say_what_they_cannot_see.py checks
# that those two sets exactly cover ci.yml's own checks, and a check from a different workflow
# file would break that partition by definition, not by a bug in either side. ─────────────────
required_from_other_workflows:
  "Dependency review":
    "2026-09-13: from .github/workflows/dependency-review.yml. Branch protection matches
     required checks by NAME across the whole repository, not by workflow file, so a check
     from any workflow can be required the same way ci.yml's own checks are. Blocks a PR that
     adds a dependency with a known high/critical vulnerability — closes the gap that
     Dependabot alerts only fire AFTER a bad dependency already reached main."

# ── Not required, each with a dated reason. A CI check in neither list fails the gate. ────
not_required:
  "Tests (server · py3.14)":
    "2026-08-28: `continue-on-error: true` in ci.yml — a forward-looking run against an
     interpreter the project does not support yet. Requiring a check that cannot fail the job
     would be theatre."
  "Tests (kube-q CLI · py3.14)":
    "2026-08-28: `continue-on-error: true`, as with the server suite above — advisory against
     an interpreter the project does not support yet, so requiring it would be theatre."
  "Tests (v2 · frozen)":
    "2026-08-28: ⚠️ NOT a deliberate decision — recorded here as an open question. v2 is a
     frozen generation cited by the published paper, and its suite has been silently empty
     before now. A red or empty frozen suite currently blocks nothing."
  "Tests (v3 · frozen)":
    "2026-08-28: ⚠️ NOT a deliberate decision — the same open question as v2. v3 is an abandoned
     spike rather than a cited generation, so it is the weaker half of that question."

# ── Not required, and NOT produced by ci.yml — same reason this has its own section as the
# required_from_other_workflows block above: the partition test only covers ci.yml. ──────────
not_required_from_other_workflows:
  "Scorecard analysis":
    "2026-09-13: deliberate. scorecard.yml runs on push/schedule/branch_protection_rule, not
     on pull_request, so there is no per-PR run for a required-check gate to wait on — making
     it required would leave every PR permanently pending on a check that never reports for
     it. It publishes to securityscorecards.dev as a monitoring signal, not a merge gate."

# ── Settings this record also pins, because each one changes what 'green' means. ──────────
settings:
  # 2026-09-13: true. A PR must now be up to date with main before merging — closes the exact
  # gap that let two individually-green PRs turn main red on their sum (the documented test
  # counts, before the doc-claims checker existed as a required-job step).
  strict: true
  # 2026-09-13: true. At least one approving review is now required before merge. Safe to
  # apply immediately alongside `enforce_admins: false` (below, still false): GitHub exempts
  # repository admins from every branch-protection rule including this one when
  # enforce_admins is off, so this only newly binds non-admin/external-contributor PRs —
  # which needed the maintainer's review in practice already — and does not block any of the
  # admin-authenticated sessions currently merging PRs to this repo.
  required_approving_review_count: 1
  # 2026-09-13: still false. Owner approved enabling this, but two blockers surfaced during
  # implementation that make flipping it immediately destructive rather than "stricter":
  #
  #   enforce_admins: at the moment this was written, at least 5 other agent sessions were
  #   concurrently merging PRs to this exact repo as the admin-authenticated owner (e.g. the
  #   #207/#208 integration). Flipping this now would instantly require a review on every one
  #   of those in-flight admin merges with no reviewer process for any of them to fall back
  #   to — this is a live-multi-session-safety issue, not a policy preference.
  #
  #   required_signatures: verified locally that commit signing is NOT configured
  #   (`git config commit.gpgsign` unset) despite GPG/SSH keys existing on the machine.
  #   Flipping this before signing is set up and a signed test commit is verified against
  #   GitHub would lock the owner AND every other active session out of pushing to main at
  #   all — checked with `git log --pretty=%H %P` that main carries real 2-parent merge
  #   commits in active use right now (e.g. 3f13e67), so this needs signing configured first,
  #   not just approved.
  #
  #   required_linear_history: also held for the same reason — verified via `git log
  #   --pretty=%p` that recent merges to main (3f13e67, PR #207) are genuine 2-parent merge
  #   commits, not squashes. Enabling this disables GitHub's "create a merge commit" button
  #   for every future PR, including ones other sessions may be mid-merge on right now.
  #
  # All three remain approved and intended — see the owner conversation this file's commit
  # references — pending: (1) commit signing actually configured and verified, (2) a
  # coordination point where no PR merge is in flight, before either is flipped live.
  enforce_admins: false
  required_signatures: false
  required_linear_history: false
